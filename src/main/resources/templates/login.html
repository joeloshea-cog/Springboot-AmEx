<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Log In | American Express</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: BentonSans, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #F7F8F9;
            color: #3D3D3D;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .navbar-custom {
            background-color: #006FCF;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 4px solid #00175A;
        }

        .navbar-custom a {
            color: #ffffff !important;
        }

        .navbar-custom .navbar-brand {
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 460px;
            padding: 28px;
            background-color: #FFFFFF;
            border-radius: 8px;
            border: 1px solid #E0E0E0;
            box-shadow: none;
            position: relative;
            text-align: left;
        }

        .container h2 {
            color: #3D3D3D;
            margin-bottom: 18px;
        }

        .form-group label {
            color: #3D3D3D;
            text-align: left;
            display: block;
        }

        .form-group input {
            border: 1px solid #E0E0E0;
            background-color: #FFFFFF;
            color: #3D3D3D;
        }

        .btn {
            background-color: #006FCF;
            border: 1px solid #006FCF;
            border-radius: 4px;
            font-weight: 700;
            color: #FFFFFF;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #00175A;
        }

        .custom-link {
            color: #006FCF;
            text-decoration: none;
            font-weight: bold;
        }

        .custom-link:hover {
            text-decoration: underline;
        }

        .footer {
            background-color: #00175A;
            color: #FFFFFF;
            padding: 12px 0;
            font-size: 13px;
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            border-top: none;
        }

        .footer a {
            color: #FFFFFF;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand d-flex align-items-center" href="#">
        American Express
    </a>
</nav>

<div class="container">
    <h2 class="text-left">Login</h2>
    <form method="post" action="/login">
        <div class="form-group">
            <label>Username:</label>
            <input type="text" class="form-control" name="username" required />
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" class="form-control" name="password" required />
        </div>
        <button type="submit" class="btn btn-block">Login</button>
    </form>
    <p class="mt-3">Don't have an account? <a href="/register" class="custom-link">Register here</a></p>

    <div th:if="${param.error}" class="alert alert-danger mt-3 text-center">
        Invalid username or password.
    </div>
</div>

<footer class="footer">
    <p>&copy; 2026 American Express. All rights reserved. | <a href="#" class="custom-link">Privacy Policy</a> | <a href="#" class="custom-link">Terms of Service</a></p>
</footer>

</body>
</html>
