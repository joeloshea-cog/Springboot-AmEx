<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transaction History | American Express</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: BentonSans, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #F7F8F9;
            color: #3D3D3D;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-direction: column;
        }

        .navbar-custom {
            background-color: #006FCF;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 4px solid #00175A;
        }

        .navbar-custom a {
            color: #ffffff !important;
        }

        .navbar-custom .navbar-brand {
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 1000px;
            margin-top: 80px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        .table-custom {
            background-color: #FFFFFF;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #E0E0E0;
            box-shadow: none;
            overflow-x: auto;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #F7F8F9;
        }

        .table-striped td, .table-striped th {
            color: #3D3D3D;
            font-weight: bold;
            padding: 15px;
            border-bottom: 1px solid #E0E0E0;
        }

        .table-striped th {
            background-color: #E0EEF9;
        }

        .text-success {
            color: #00804A !important;
        }

        .text-danger {
            color: #B41601 !important;
        }

        .btn-filter {
            background-color: #006FCF;
            border: 1px solid #006FCF;
            border-radius: 4px;
            color: #FFFFFF;
            font-weight: 700;
        }

        .btn-filter:hover {
            background-color: #00175A;
            color: #FFFFFF;
        }

        .statement-filter label {
            font-weight: 700;
        }

        .custom-link {
            color: #006FCF;
            text-decoration: none;
            font-weight: bold;
        }

        .custom-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-custom">
    <a class="navbar-brand d-flex align-items-center" href="#">
        American Express
    </a>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/transactions">Transactions</a></li>
        <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
    </ul>
</nav>

<div class="container">
    <h2 class="text-center">Transaction History</h2>
    <form method="get" action="/transactions" class="statement-filter form-inline justify-content-center mb-3">
        <label for="from" class="mr-2">Statement from</label>
        <input type="date" id="from" name="from" class="form-control mr-3" th:value="${from}" />
        <label for="to" class="mr-2">to</label>
        <input type="date" id="to" name="to" class="form-control mr-3" th:value="${to}" />
        <button type="submit" class="btn btn-filter mr-2">Filter</button>
        <a href="/transactions" class="custom-link">Clear</a>
    </form>
    <div class="table-responsive table-custom">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="transaction : ${transactions}">
                <td th:text="${transaction.id}"></td>
                <td th:text="${transaction.type}"></td>
                <td th:text="${transaction.amount}"
                    th:classappend="${transaction.type.contains('Transfer In') || transaction.type == 'Deposit'} ? 'text-success' : 'text-danger'">
                    <span th:text="${transaction.type.contains('Transfer In') || transaction.type == 'Deposit'} ? '+$' + transaction.amount : '-$' + transaction.amount"></span>
                </td>
                <td th:text="${transaction.timestamp}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="text-center"><a href="/dashboard" class="custom-link">Back to Dashboard</a></p>
</div>

</body>
</html>
